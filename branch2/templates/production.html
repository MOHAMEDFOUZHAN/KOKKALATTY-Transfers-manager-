<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch 1 - Tea Production</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #818cf8;
            --accent-glow: rgba(129, 140, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --glass-border: rgba(255, 255, 255, 0.1);
            --input-bg: rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(circle at 10% 20%, rgba(129, 140, 248, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.05) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 8px;
        }

        .nav-link:hover {
            color: var(--accent);
            background: rgba(129, 140, 248, 0.1);
        }

        .nav-link.active {
            color: var(--text-main);
            background: var(--accent);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
        }

        .btn-primary {
            background: linear-gradient(135deg, #818cf8 0%, #4f46e5 100%);
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            text-align: left;
            padding: 15px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--glass-border);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--glass-border);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header fade-in">
            <h1><i class="fas fa-industry"></i> Branch 1 Production</h1>
            <div class="nav-links">
                <a href="{{ url_for('transfer') }}" class="nav-link">Transfer</a>
                <a href="{{ url_for('production') }}" class="nav-link active">Production</a>
            </div>
            <div style="display: flex; gap: 20px; align-items: center;">
                <a href="{{ url_for('settings') }}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 600;">
                    <i class="fas fa-cog"></i> Settings
                </a>
                <span style="color: var(--text-muted); font-size: 0.9rem;">
                    <i class="fas fa-user"></i> {{ session['username'] }}
                </span>
                <a href="{{ url_for('logout') }}" style="color: var(--danger); text-decoration: none; font-size: 0.9rem; font-weight: 600;">Logout</a>
            </div>
        </div>

        <!-- Production Entry -->
        <div class="glass-card fade-in" style="animation-delay: 0.1s">
            <h2 style="margin-bottom: 25px;"><i class="fas fa-plus-circle" style="color: var(--accent)"></i> Daily
                Production Entry</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label>Production Date</label>
                    <input type="date" id="prod_date">
                </div>
                <div class="form-group">
                    <label>Grade</label>
                    <select id="prod_grade">
                        <option value="BOP">BOP</option>
                        <option value="BP">BP</option>
                        <option value="Dust">Dust</option>
                        <option value="PD">PD</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Quantity Produced (Kg)</label>
                    <input type="number" id="prod_qty" placeholder="0.00">
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 25px;">
                <label>Notes / Observations</label>
                <textarea id="prod_notes" rows="3" placeholder="Enter any production notes..."></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end;">
                <button class="btn btn-primary" onclick="alert('Record Saved locally (Demo)')">
                    <i class="fas fa-save"></i> Save Production Record
                </button>
            </div>
        </div>

        <!-- History -->
        <div class="glass-card fade-in" style="animation-delay: 0.2s">
            <h2><i class="fas fa-history"></i> Production History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Grade</th>
                        <th>Quantity</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>11/03/2026</td>
                        <td>BOP</td>
                        <td>450.00 Kg</td>
                        <td>Normal production run</td>
                    </tr>
                    <tr>
                        <td>10/03/2026</td>
                        <td>Dust</td>
                        <td>320.50 Kg</td>
                        <td>High quality batch</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            © 2026 Developed & Maintained by <span class="brand-name">MAPLE PRO</span>
        </div>
    </footer>

    <script>
        // Set default date to today
        document.getElementById('prod_date').valueAsDate = new Date();
    </script>
</body>

</html>
